<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15202B">
<title>Pass Route Tokyo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#E9EDF1;--surface:#FFFFFF;--ink:#15202B;--muted:#56626E;--rule:#D3D9E0;--soft:#F3F5F8;--ok:#127A4B;--okbg:#E2F3EA;--warn:#8A5A00;--warnbg:#FFF3D6;--no:#C7322B;--nobg:#FDE8E6;--me:#1A73E8;--focus:#2563EB;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1217;--surface:#161D24;--ink:#E7ECF0;--muted:#97A3AE;--rule:#2B353F;--soft:#1D2630;--ok:#5ACB8E;--okbg:#12301F;--warn:#F3C35B;--warnbg:#33270B;--no:#FF7A70;--nobg:#3A1614;--me:#6EA8FF;--focus:#7AA7FF;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1217;--surface:#161D24;--ink:#E7ECF0;--muted:#97A3AE;--rule:#2B353F;--soft:#1D2630;--ok:#5ACB8E;--okbg:#12301F;--warn:#F3C35B;--warnbg:#33270B;--no:#FF7A70;--nobg:#3A1614;--me:#6EA8FF;--focus:#7AA7FF;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:720px;margin:0 auto;padding:14px 12px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 2px 12px}
h1{font-size:22px;font-weight:700;margin:0;letter-spacing:-0.01em}
.pass{font-size:13px;color:var(--ok);background:var(--okbg);padding:3px 10px;border-radius:999px;white-space:nowrap}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:16px}
.trip{padding:6px 6px 6px 14px;display:grid;grid-template-columns:18px minmax(0,1fr) 44px;gap:0 10px;align-items:center;position:relative}
.dot{width:12px;height:12px;border-radius:50%;border:3px solid var(--ink);justify-self:center}
.dot.to{background:var(--ink)}
.rail{position:absolute;left:22px;top:30px;bottom:30px;width:2px;background:var(--rule)}
.field{position:relative}
.field input{width:100%;font:inherit;font-size:17px;color:var(--ink);background:transparent;border:0;padding:12px 4px;outline:none}
.field input::placeholder{color:var(--muted)}
.sep{border-top:1px solid var(--rule)}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;color:var(--ink);font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconbtn:hover{background:var(--soft)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sugg{position:absolute;left:-36px;right:-50px;top:100%;z-index:30;background:var(--surface);border:1px solid var(--rule);border-radius:12px;margin-top:4px;max-height:320px;overflow:auto;display:none;box-shadow:0 10px 30px rgba(0,0,0,.14)}
.sugg.on{display:block}
.sugg button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border:0;background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer}
.sugg button:hover,.sugg button.hl{background:var(--soft)}
.sugg .ja{color:var(--muted);font-size:13px;margin-left:auto}
.chips{display:flex;gap:3px;flex-wrap:wrap}
.b{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:22px;padding:0 3px;border-radius:50%;border:3px solid;font-size:11px;font-weight:700;background:#fff;color:#15202B;line-height:1;flex-shrink:0}
.b.lg{min-width:34px;height:34px;border-width:4px;font-size:14px}
.me-i{width:22px;height:22px;border-radius:50%;background:var(--me);border:3px solid var(--surface);box-shadow:0 0 0 2px var(--me);flex-shrink:0}
.tools{display:flex;gap:8px;margin:10px 0 12px;flex-wrap:wrap;align-items:center}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:3px}
.seg button{font:inherit;font-size:14px;border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.mapbox{position:relative;height:min(50vh,440px);overflow:hidden}
.trip-on .mapbox{height:min(42vh,380px)}
#map{width:100%;height:100%;display:block;background:var(--soft);font:inherit}
.mapctl,.legend,.pick{z-index:1000}
.leaflet-tooltip.lbl{background:transparent;border:0;box-shadow:none;padding:0;font:700 12px/1.2 "Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);text-shadow:0 0 3px var(--surface),0 0 3px var(--surface),0 0 2px var(--surface)}
.leaflet-tooltip.lbl::before{display:none}
.leaflet-tooltip.lbl-lm{font-weight:500;color:var(--muted)}
.lm span{display:block;width:11px;height:11px;margin:2px;background:var(--ink);border:2px solid var(--surface);transform:rotate(45deg)}
.pin span{display:block;width:22px;height:22px;border-radius:50% 50% 50% 0;background:var(--ink);border:3px solid var(--surface);transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.3)}
.leaflet-control-attribution{font-size:10px;background:var(--surface)!important;color:var(--muted)}
.leaflet-control-attribution a{color:var(--muted)}
.mapbox{height:min(58vh,520px)}
.mapctl{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:40px;height:40px;border-radius:10px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);font-size:18px;cursor:pointer}
.mapctl button[aria-pressed="true"]{background:var(--me);color:#fff;border-color:var(--me)}
.legend{position:absolute;left:10px;top:10px;background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:6px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px;cursor:pointer;font-family:inherit;text-align:left}
.legend span{display:flex;align-items:center;gap:8px;white-space:nowrap}
.legend i{display:inline-block;width:22px;height:0;border-top:4px solid var(--ink)}
.legend i.no{border-top:3px dashed var(--no)}
.legend.off .r2{opacity:.4;text-decoration:line-through}
.pick{position:absolute;left:10px;right:10px;bottom:10px;background:var(--surface);border:1px solid var(--rule);border-radius:14px;padding:10px 12px;display:none;flex-direction:column;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.pick.on{display:flex}
.pick .top{display:flex;align-items:center;gap:8px;min-width:0}
.pick strong{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .why{font-size:13px;color:var(--no);background:var(--nobg);padding:6px 8px;border-radius:8px;line-height:1.4}
.pick .row{display:flex;gap:8px}
.pick .row button{flex:1}
.btn{font:inherit;font-size:15px;padding:10px 14px;border-radius:12px;border:1px solid var(--rule);background:var(--soft);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink);font-weight:700}
.btn.go{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700;font-size:17px;width:100%;padding:14px}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer;width:32px;height:32px}
.result{margin-top:12px;padding:16px}
.sum{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:14px;border-bottom:1px solid var(--rule)}
.big{font-size:40px;font-weight:700;line-height:1;letter-spacing:-0.02em}
.big small{font-size:18px;font-weight:500;margin-left:3px}
.meta{color:var(--muted);font-size:14px;display:flex;gap:4px 14px;flex-wrap:wrap}
.meta b{color:var(--ink);font-weight:500}
.leg{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:12px}
.lbar{display:flex;flex-direction:column;align-items:center}
.lbar .bar{flex:1;width:8px;min-height:24px}
.lbar .walkbar{flex:1;width:0;border-left:4px dotted var(--muted);min-height:24px}
.stn{font-size:18px;font-weight:700;margin:4px 0 0;overflow-wrap:anywhere}
.stn .ja{font-size:13px;font-weight:400;color:var(--muted);margin-left:6px}
.ride{padding:8px 0 12px;color:var(--muted);font-size:14px}
.ride .ln{color:var(--ink);font-weight:500;font-size:15px}
.ride details{margin-top:6px}
.ride summary{cursor:pointer;color:var(--ink)}
.ride ol{margin:6px 0 0;padding-left:18px}
.note{margin-top:8px;background:var(--warnbg);color:var(--warn);font-size:13px;padding:8px 10px;border-radius:10px;line-height:1.45}
.xfer{grid-column:1/-1;display:flex;align-items:center;gap:10px;margin:2px 0 8px;padding:10px 12px;border:1px dashed var(--rule);border-radius:12px;color:var(--muted);font-size:14px}
a{color:var(--me)}
.empty{padding:20px 16px;color:var(--muted);font-size:15px;margin-top:12px}
.err{color:var(--no);font-size:14px;margin:6px 4px 0;min-height:1em}
.foot{color:var(--muted);font-size:13px;margin:16px 4px 0;line-height:1.5}
/* trip mode */
.live{padding:16px;margin-bottom:12px;border-width:2px;border-color:var(--ink)}
.live .stepof{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.live .instr{font-size:24px;font-weight:700;line-height:1.25;margin:6px 0 4px;display:flex;gap:10px;align-items:flex-start}
.live .sub{color:var(--muted);font-size:15px}
.live .now{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0}
.live .now div{background:var(--soft);border-radius:12px;padding:8px 10px}
.live .now small{display:block;font-size:12px;color:var(--muted)}
.live .now strong{font-size:20px;font-weight:700}
.live .acts{display:flex;gap:8px;flex-wrap:wrap}
.live .acts .btn{flex:1}
.stops{list-style:none;margin:12px 0 0;padding:0}
.stops li{display:flex;align-items:center;gap:10px;padding:7px 4px;border-top:1px solid var(--rule);font-size:15px;cursor:pointer}
.stops li .t{width:14px;height:14px;border-radius:50%;border:3px solid var(--c);flex-shrink:0;background:var(--surface)}
.stops li.done{color:var(--muted)}
.stops li.done .t{background:var(--c)}
.stops li.cur{font-weight:700}
.stops li.cur .t{box-shadow:0 0 0 4px var(--soft);background:var(--c)}
.stops li .hint{margin-left:auto;font-size:12px;color:var(--muted);font-weight:400}
.plan{display:flex;flex-direction:column;gap:0;margin-top:12px}
.pstep{display:flex;gap:10px;align-items:center;padding:10px 4px;border-top:1px solid var(--rule);font-size:14px;color:var(--muted)}
.pstep.cur{color:var(--ink);font-weight:700}
.pstep.done{text-decoration:line-through;opacity:.6}
.gps{font-size:12px;color:var(--muted);margin-top:8px}
@media (prefers-reduced-motion:no-preference){.result,.live{animation:in .25s ease-out}@keyframes in{from{opacity:0;transform:translateY(6px)}}}
</style>
</head>
<body>
<div class="wrap" id="app">
<header><h1>Pass route</h1><span class="pass">Tokyo Metro + Toei</span></header>

<div id="planner">
<div class="panel trip">
  <span class="rail" aria-hidden="true"></span>
  <span class="dot" aria-hidden="true"></span>
  <div class="field"><input id="from" placeholder="From: station, place, address" autocomplete="off" aria-label="From"><div class="sugg" id="sf" role="listbox"></div></div>
  <button class="iconbtn" id="loc" aria-label="Start from my location" title="My location">◎</button>
  <span class="dot to" aria-hidden="true"></span>
  <div class="field sep"><input id="to" placeholder="To: station, place, address or tap map" autocomplete="off" aria-label="To"><div class="sugg" id="st" role="listbox"></div></div>
  <button class="iconbtn" id="swap" aria-label="Swap" title="Swap">⇅</button>
</div>
<div class="err" id="err" role="status"></div>
<div class="tools">
  <div class="seg" role="group" aria-label="Route preference">
    <button id="mFast" aria-pressed="true">Fastest</button>
    <button id="mFew" aria-pressed="false">Fewer changes</button>
  </div>
</div>
</div>

<div id="livebox"></div>

<div class="panel mapbox">
  <div id="map" role="application" aria-label="Map of covered subway lines and lines to avoid"></div>
  <button class="legend" id="legend" aria-label="Toggle lines not covered"><span><i></i>Your pass</span><span class="r2"><i class="no"></i>Don’t take</span><span>◆ Places</span></button>
  <div class="mapctl"><button id="follow" aria-label="Follow my position" aria-pressed="false">◎</button><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button><button id="zfit" aria-label="Fit route">⤢</button></div>
  <div class="pick" id="pick"><div class="top"><strong id="pickName"></strong><button class="x" id="pickX" aria-label="Close">×</button></div><div class="why" id="pickWhy" hidden></div><div class="row"><button class="btn" id="pickFrom">Start here</button><button class="btn primary" id="pickTo">Go here</button></div></div>
</div>

<div id="out"></div>
<p class="foot" id="foot">Times are estimates: trains from distance plus transfer time, walking at 4.8 km/h with a 25% detour allowance. Red dashed lines are JR and private railways your pass doesn’t cover.</p>
</div>

const allB=L.latLngBounds(nodes.map(n=>[n.lat,n.lon]));const all=allB;
let stMarks=[],lmMarks=[];
function buildBase(){[gAvoid,gAvSt,gLines,gSt,gLm].forEach(g=>g.clearLayers());
 AVOID.forEach(A=>A.s.forEach(seg=>L.polyline(seg.map(p=>[p[2],p[1]]),{pane:"avoid",color:C.no,weight:2.5,dashArray:"6 5",opacity:.85,interactive:false}).addTo(gAvoid)));
 avoidSt.forEach(a=>L.circleMarker([a.lat,a.lon],{renderer:rAv,radius:3.5,color:C.no,weight:1.5,fillColor:C.surface,fillOpacity:1,bubblingMouseEvents:false}).on("click",()=>pickAvoid(a)).addTo(gAvSt));
 LINES.forEach(Ln=>L.polyline(Ln.st.map(s=>[s[3],s[2]]),{pane:"lines",color:Ln.color,weight:5,opacity:.95,interactive:false}).addTo(gLines));
 stMarks=stList.map(S=>{const m=L.circleMarker([S.lat,S.lon],{renderer:rSt,radius:4,color:S.lines.length>1?C.ink:LINES[S.lines[0]].color,weight:S.lines.length>1?2.5:2,fillColor:C.surface,fillOpacity:1,bubblingMouseEvents:false}).on("click",()=>pickStation(S)).addTo(gSt);m.bindTooltip(S.disp,{permanent:true,direction:"right",className:"lbl",offset:[7,0]});return{m,S,ll:L.latLng(S.lat,S.lon)}});
 lmMarks=LANDMARKS.map(l=>{const m=L.marker([l[1],l[2]],{pane:"lm",icon:L.divIcon({className:"lm",html:"<span></span>",iconSize:[16,16]}),bubblingMouseEvents:false}).on("click",e=>{L.DomEvent.stopPropagation(e);pickLm(l)}).addTo(gLm);m.bindTooltip(l[0],{permanent:true,direction:"right",className:"lbl lbl-lm",offset:[8,0]});return{m,l}});
 sizeDots()}
function applyAvoid(){[gAvoid,gAvSt].forEach(g=>{if(!showAvoid)map.removeLayer(g)});if(showAvoid){gAvoid.addTo(map);if(map.getZoom()>=13.5)gAvSt.addTo(map)}$("legend").classList.toggle("off",!showAvoid)}
$("legend").onclick=()=>{showAvoid=!showAvoid;store.set("avoid",showAvoid);applyAvoid()};
function sizeDots(){const z=map.getZoom();stMarks.forEach(({m,S})=>m.setRadius(z>=15?7:z>=13?5:3.5));
 if(z>=13.5){gLm.addTo(map);if(showAvoid)gAvSt.addTo(map)}else{map.removeLayer(gLm);map.removeLayer(gAvSt)}
 drawLabels()}
function fit(b){map.fitBounds(b,{padding:[12,12]})}
function centerOn(p){map.setView([p.lat,p.lon],Math.max(map.getZoom(),16))}
function activeSteps(){return trip?trip.steps:route?route.steps:null}
function drawLabels(){const z=map.getZoom(),vb=map.getBounds().pad(0.1),show=new Set(),steps=activeSteps();
 if(steps)steps.forEach(s=>{if(s.type==="ride"){show.add(nodes[s.stops[0]].name);show.add(nodes[s.stops[s.stops.length-1]].name)}});
 else{if(from&&from.type==="station")show.add(from.name);if(to&&to.type==="station")show.add(to.name)}
 stMarks.forEach(({m,S,ll})=>{(show.has(S.name)||(z>=14.5&&vb.contains(ll)))?m.openTooltip():m.closeTooltip()});
 lmMarks.forEach(({m})=>{z>=15?m.openTooltip():m.closeTooltip()})}
let destM=null;
function drawRoute(doFit){gRoute.clearLayers();destM=null;const steps=activeSteps();
 gLines.eachLayer(l=>l.setStyle({opacity:steps?.35:.95}));gAvoid.eachLayer(l=>l.setStyle({opacity:steps?.45:.85}));
 const pts=[];
 if(steps){steps.forEach((s,k)=>{const dim=trip&&k<trip.i?.35:1;
   if(s.type==="walk"){const ll=[[s.from.lat,s.from.lon],[s.to.lat,s.to.lon]];pts.push(...ll);L.polyline(ll,{pane:"route",color:C.ink,weight:5,dashArray:"1 10",lineCap:"round",opacity:dim,interactive:false}).addTo(gRoute)}
   if(s.type==="ride"){const ll=s.stops.map(i=>[nodes[i].lat,nodes[i].lon]);pts.push(...ll);L.polyline(ll,{pane:"route",color:C.surface,weight:12,opacity:dim,interactive:false}).addTo(gRoute);L.polyline(ll,{pane:"route",color:LINES[s.li].color,weight:7,opacity:dim,interactive:false}).addTo(gRoute)}});
  const T=trip?trip.T:route.T;if(!T.station)destM=pin(T)}
 else if(to&&to.type==="point"){destM=pin(to);pts.push([to.lat,to.lon])}
 if(doFit&&steps&&pts.length)map.fitBounds(L.latLngBounds(pts),{paddingTopLeft:[30,40],paddingBottomRight:[70,40],maxZoom:16});
 sizeDots()}
function pin(p){const m=L.marker([p.lat,p.lon],{pane:"me",icon:L.divIcon({className:"pin",html:"<span></span>",iconSize:[22,22],iconAnchor:[11,22]}),interactive:false}).addTo(gRoute);m.bindTooltip(p.label||"Dropped pin",{permanent:true,direction:"right",className:"lbl",offset:[10,-12]});return m}
function drawMe(){gMe.clearLayers();if(!pos)return;L.circle([pos.lat,pos.lon],{pane:"me",radius:Math.min(pos.acc,500),color:C.me,weight:1,fillColor:C.me,fillOpacity:.12,interactive:false}).addTo(gMe);L.circleMarker([pos.lat,pos.lon],{pane:"me",radius:8,color:"#fff",weight:3,fillColor:C.me,fillOpacity:1,interactive:false}).addTo(gMe)}
map.on("zoomend",sizeDots);map.on("moveend",drawLabels);
function stopFollow(){if(follow){follow=false;$("follow").setAttribute("aria-pressed","false")}}
map.on("dragstart",stopFollow);
let picked=null;
function showPick(name,why){$("pickName").textContent=name;const w=$("pickWhy");w.hidden=!why;if(why)w.textContent=why;$("pick").classList.add("on")}
function pickStation(S){picked={type:"station",name:S.name};showPick(S.disp+" "+S.ja)}
function pickLm(l){picked={type:"point",lat:l[1],lon:l[2],label:l[0]};showPick(l[0])}
function pickAvoid(a){picked={type:"point",lat:a.lat,lon:a.lon,label:a.name+" (JR/private)"};showPick(a.name,`${a.line} isn’t covered. “Go here” routes you to the nearest covered station and walks you the rest.`)}
map.on("click",e=>{picked={type:"point",lat:e.latlng.lat,lon:e.latlng.lng,label:"Dropped pin"};showPick("Dropped pin")});
$("pickX").onclick=()=>$("pick").classList.remove("on");
$("pickFrom").onclick=()=>{setEnd("from",picked);$("pick").classList.remove("on")};
$("pickTo").onclick=()=>{setEnd("to",picked);$("pick").classList.remove("on")};
$("zin").onclick=()=>map.zoomIn();$("zout").onclick=()=>map.zoomOut();
$("zfit").onclick=()=>{stopFollow();activeSteps()?drawRoute(true):fit(all)};
$("follow").onclick=()=>{follow=!follow;$("follow").setAttribute("aria-pressed",follow);if(follow){startWatch();if(pos)centerOn(pos)}};
darkQ.addEventListener&&darkQ.addEventListener("change",()=>{readC();setTiles();buildBase();drawRoute();drawMe()});
buildBase();

/* inputs */
const labelOf=e=>!e?"":e.type==="here"?"My location":e.type==="station"?stations[e.name].disp:e.label||"Dropped pin";
function setEnd(which,e){if(trip)return;if(which==="from")from=e;else to=e;store.set(which,e);$(which).value=labelOf(e);$("err").textContent="";$("err").style.color="";if(e&&e.type==="here")startWatch();renderPlan();drawLabels()}
function suggest(inp,box,which){let hi=-1;
 const show=()=>{const q=norm(inp.value);let items=[];
  if(which==="from"&&(!q||"mylocation".includes(q)))items.push(`<button type="button" data-here="1"><span class="me-i"></span><span>My location</span></button>`);
  if(q){stList.filter(S=>norm(S.disp).includes(q)||S.ja.includes(inp.value.trim())).sort((a,b)=>(norm(a.disp).indexOf(q)-norm(b.disp).indexOf(q))||(a.disp.length-b.disp.length)).slice(0,8).forEach(S=>items.push(`<button type="button" data-n="${esc(S.name)}"><span class="chips">${S.lines.map(l=>badge(LINES[l])).join("")}</span><span>${esc(S.disp)}</span><span class="ja">${S.ja}</span></button>`));
   const jr=avoidSt.find(a=>norm(a.name)===q||norm(a.name).startsWith(q));if(items.length<=1&&jr)items.push(`<button type="button" data-av="${esc(jr.name)}"><span class="b" style="border-color:var(--no)">!</span><span>${esc(jr.name)}: ${esc(jr.line)}, not covered. Route via nearest covered station</span></button>`)}
  if(q.length>=2)LANDMARKS.filter(l=>norm(l[0]).includes(q)).slice(0,4).forEach(l=>items.push(`<button type="button" data-lm="${esc(l[0])}"><span class="b" style="border-color:var(--ink)">◆</span><span>${esc(l[0])}</span></button>`));
  const raw=inp.value.trim();
  if(parseCoords(raw))items.unshift(`<button type="button" data-xy="1"><span class="b" style="border-color:var(--me)">⌖</span><span>Use this map location</span></button>`);
  else if(/^\s*https?:\/\/(maps\.app\.goo\.gl|goo\.gl)\S*\s*$/.test(raw))items.unshift(`<div style="padding:12px;color:var(--muted);font-size:14px">A short link alone has no location. Paste the whole text Google Maps shares (name and address), or use Share and pick Pass route.</div>`);
  else if(/https?:\/\//.test(raw))items.unshift(`<button type="button" data-geo="1"><span class="b" style="border-color:var(--muted)">🔍</span><span>Find this Google Maps place</span></button>`);
  else if(raw.length>=3)items.push(`<button type="button" data-geo="1"><span class="b" style="border-color:var(--muted)">🔍</span><span>Find “${esc(raw)}” as an address or place</span></button>`);
  if(raw.length>=3&&!items.length)items.push(`<div style="padding:12px;color:var(--muted);font-size:14px">No match. You can also tap anywhere on the map.</div>`);
  box.innerHTML=items.join("");box.classList.toggle("on",items.length>0);hi=-1};
 const choose=b=>{const raw=inp.value.trim();if(b.dataset.geo){box.classList.remove("on");inp.blur();geocode(raw,which);return}if(b.dataset.xy){const c=parseCoords(raw);setEnd(which,{type:"point",lat:c.lat,lon:c.lon,label:"Map location"});centerOn(c)}else if(b.dataset.lm){const l=LANDMARKS.find(x=>x[0]===b.dataset.lm);setEnd(which,{type:"point",lat:l[1],lon:l[2],label:l[0]})}else if(b.dataset.here)setEnd(which,{type:"here"});else if(b.dataset.av){const a=avoidSt.find(x=>x.name===b.dataset.av);setEnd(which,{type:"point",lat:a.lat,lon:a.lon,label:a.name+" (JR/private)"})}else setEnd(which,{type:"station",name:b.dataset.n});box.classList.remove("on");inp.blur()};
 inp.addEventListener("input",show);
 inp.addEventListener("paste",()=>setTimeout(()=>{const raw=inp.value.trim(),c=parseCoords(raw);if(c){box.classList.remove("on");inp.blur();setEnd(which,{type:"point",lat:c.lat,lon:c.lon,label:"Map location"});centerOn(c)}else if(/https?:\/\/|\n/.test(raw)){box.classList.remove("on");inp.blur();geocode(raw,which)}},0));inp.addEventListener("focus",()=>{inp.select();show()});
 inp.addEventListener("keydown",e=>{const bs=[...box.querySelectorAll("button")];if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();if(!bs.length)return;hi=(hi+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle("hl",i===hi))}else if(e.key==="Enter"){const b=bs[hi>=0?hi:0];if(b)choose(b)}else if(e.key==="Escape")box.classList.remove("on")});
 box.addEventListener("pointerdown",e=>e.preventDefault());
 box.addEventListener("click",e=>{const b=e.target.closest("button");if(b)choose(b)});
 inp.addEventListener("blur",()=>{box.classList.remove("on");inp.value=labelOf(which==="from"?from:to)})}
suggest($("from"),$("sf"),"from");suggest($("to"),$("st"),"to");
$("loc").onclick=()=>setEnd("from",{type:"here"});
$("swap").onclick=()=>{const f=from;from=to;to=f;store.set("from",from);store.set("to",to);$("from").value=labelOf(from);$("to").value=labelOf(to);if(from&&from.type==="here")startWatch();renderPlan()};
function setMode(m){mode=m;store.set("mode",m);$("mFast").setAttribute("aria-pressed",m==="fast");$("mFew").setAttribute("aria-pressed",m==="few");renderPlan()}
$("mFast").onclick=()=>setMode("fast");$("mFew").onclick=()=>setMode("few");

function renderAll(){$("app").classList.toggle("trip-on",!!trip);$("planner").hidden=!!trip;$("foot").hidden=!!trip;map.invalidateSize();renderLive();renderPlan();drawRoute(true)}
setInterval(()=>{if(trip&&!trip.arrived)renderLive()},30000);
window.addEventListener("resize",()=>{map.invalidateSize()});

$("from").value=labelOf(from);$("to").value=labelOf(to);setMode(mode);applyAvoid();
requestAnimationFrame(()=>{fit(all);if(trip||(from&&from.type==="here"))startWatch();if(trip){keepAwake();follow=true;$("follow").setAttribute("aria-pressed","true")}renderAll()});
(function(){const q=new URLSearchParams(location.search);const s=[q.get("title"),q.get("text"),q.get("url")].filter(Boolean).join("\n").trim();if(!s)return;history.replaceState(null,"",location.href.split("?")[0]);if(trip)return;
 if(!from){from={type:"here"};store.set("from",from);$("from").value=labelOf(from);startWatch()}
 const c=parseCoords(s);if(c){setEnd("to",{type:"point",lat:c.lat,lon:c.lon,label:"Shared location"});centerOn(c)}else{$("to").value="Shared place";geocode(s,"to")}})();
if("serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.(ai|site)|claudeusercontent/.test(location.hostname)){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
